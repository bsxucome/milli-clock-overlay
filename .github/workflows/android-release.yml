name: Android 版本发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 Java 环境
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android SDK 路径
        shell: bash
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_PATH" ]; then
            echo "当前构建环境未提供 Android SDK 路径。"
            exit 1
          fi
          printf "sdk.dir=%s\n" "$SDK_PATH" > local.properties

      - name: 移除本地 Windows 构建路径覆盖项
        run: sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties

      - name: 准备发布签名
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            printf '%s\n' \
              'storeFile=release-keystore.jks' \
              "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
              "keyAlias=$ANDROID_KEY_ALIAS" \
              "keyPassword=$ANDROID_KEY_PASSWORD" \
              > keystore.properties
          else
            echo "未配置完整的发布签名密钥，本次将生成未签名发布版 APK。"
          fi

      - name: 授予 Gradle Wrapper 执行权限
        run: chmod +x ./gradlew

      - name: 构建发布版 APK
        run: ./gradlew assembleRelease

      - name: 准备发布附件
        id: assets
        shell: bash
        run: |
          APP_NAME="Milli-Clock-Overlay"
          VERSION_TAG="${GITHUB_REF_NAME}"
          ASSET_DIR="build/release-assets"
          mkdir -p "$ASSET_DIR"

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            APK_NAME="${APP_NAME}-${VERSION_TAG}.apk"
          else
            APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
            APK_NAME="${APP_NAME}-${VERSION_TAG}-unsigned.apk"
          fi

          FINAL_APK_PATH="${ASSET_DIR}/${APK_NAME}"
          cp "$APK_PATH" "$FINAL_APK_PATH"

          SHA_NAME="${APK_NAME}.sha256"
          FINAL_SHA_PATH="${ASSET_DIR}/${SHA_NAME}"
          sha256sum "$FINAL_APK_PATH" > "$FINAL_SHA_PATH"

          {
            echo "apk_path=$FINAL_APK_PATH"
            echo "apk_name=$APK_NAME"
            echo "sha_path=$FINAL_SHA_PATH"
            echo "sha_name=$SHA_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: 上传发布构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.ref_name }}
          path: |
            ${{ steps.assets.outputs.apk_path }}
            ${{ steps.assets.outputs.sha_path }}
          if-no-files-found: error

      - name: 发布 GitHub 版本
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="release-notes.md"

          printf '%s\n' \
            "毫秒悬浮时钟 ${TAG}" \
            "" \
            "主要功能：" \
            "- 可拖动的悬浮时钟" \
            "- 日期与时间分行显示" \
            "- 毫秒读数以红色显示" \
            "- 轻点时钟显示关闭按钮" \
            "- 适配 Android 14 及以上版本的前台服务要求" \
            "" \
            "界面截图与操作说明：" \
            "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/README.md#界面截图" \
            "" \
            "使用说明：" \
            "- 部分系统设置和安全页面会按系统规则隐藏第三方悬浮窗" \
            "- 未配置签名密钥时生成未签名 APK，需签名后才能安装" \
            > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.assets.outputs.apk_path }}" \
              "${{ steps.assets.outputs.sha_path }}" \
              --clobber
            gh release edit "$TAG" --title "毫秒悬浮时钟 ${TAG}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              "${{ steps.assets.outputs.apk_path }}" \
              "${{ steps.assets.outputs.sha_path }}" \
              --title "毫秒悬浮时钟 ${TAG}" \
              --notes-file "$NOTES_FILE"
          fi
